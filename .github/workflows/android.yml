name: Android app

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 6 / Android Gradle Plugin 8.2 run on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test backend
        run: npm test

      - name: Build app bundle (on-device backend)
        run: npm run build:app
        env:
          # Optional: enables Google sign-in + cloud backup. Add these as repository secrets.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # A stable signing key is needed for Google sign-in (its SHA-1 is registered in Firebase).
      # Without the secrets, a debug-signed APK is produced (fine for trying the app).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kompare.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kompare.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../Kompare.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../Kompare.apk
          fi

      # Direct download link for phones: .../releases/download/android-latest/Kompare.apk
      - name: Publish "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Kompare.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Kompare for Android (latest build #${{ github.run_number }})" \
            --notes "Tap **Kompare.apk** below on your Android phone to download and install. Built from ${{ github.sha }}."

      - uses: actions/upload-artifact@v4
        with:
          name: Kompare-android-apk
          path: Kompare.apk
          if-no-files-found: error
          retention-days: 30
