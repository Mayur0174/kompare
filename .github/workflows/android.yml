name: Android app

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 6 / Android Gradle Plugin 8.2 run on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test backend
        run: npm test

      - name: Build app bundle (on-device backend)
        run: npm run build:app

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kompare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kompare-android-apk
          path: Kompare.apk
          if-no-files-found: error
          retention-days: 30
